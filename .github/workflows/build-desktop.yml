name: build-desktop

# 什么时候跑：
#   1. 手动点（Actions → build-desktop → Run workflow）—— 只出 artifact，不发版
#   2. 打 tag（v0.1.0）—— 出三平台包 + 建 Release + 自动生成 latest.json 补传
#
# 发版只要一条命令：
#   git tag v0.2.0 && git push origin v0.2.0
# 之后装在用户机器上的旧版就能通过「关于 → 检查更新」看到这一版。
# 前提：仓库是 public（private 的 Release 附件匿名下载 404），且不要勾 Pre-release。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # 一个平台挂了别把其它平台的结果也丢掉
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: --win --x64
            artifact: ThShell-windows
          # macos-latest 是 arm64 机器，两个架构都能从它交叉打出来
          - name: macOS (x64 + arm64)
            os: macos-latest
            args: --mac --x64 --arm64
            artifact: ThShell-macos
          # 在 Linux 上原生构建，不用 Docker —— 这也是唯一能产出 deb/rpm 的环境
          - name: Linux (AppImage / deb / rpm / tar.gz)
            os: ubuntu-latest
            args: --linux AppImage deb rpm tar.gz
            artifact: ThShell-linux

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 前端 + 主进程一起构建（vue-tsc 顺带做类型检查，类型错就不出包）
      - run: pnpm build

      - name: 打包
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 没有签名证书：显式告诉 electron-builder 别去找钥匙串
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # 只收成品，别把 unpacked 目录（几百个文件）一起传上去
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      # 打了 tag 才挂 Release，手动跑只出 artifact
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 不传 body 也不开 generate_release_notes，Release 页就是空白一片，
          # 用户点进去只看到十个附件，看不出这版改了什么。
          # 交给 GitHub 按 tag 之间的提交自动汇总，省得每次手写。
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  # 三个平台都打完之后，汇总生成本周版本的 latest.json 补传上去。
  # 客户端只认这一个文件：releases/latest/download/latest.json
  # 少了它，装在用户机器上的旧版就永远查不到新版本。
  manifest:
    name: 生成 latest.json
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 把三个平台的产物平铺到 release/ —— make-manifest 按文件名判断平台和格式
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 生成 latest.json
        run: |
          node scripts/make-manifest.mjs \
            --gh "${{ github.repository }}" \
            --out release/latest.json \
            --notes "ThShell ${GITHUB_REF_NAME#v}"

      - name: 补传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release/latest.json --clobber

      # 把清单也留一份在 artifact 里，出问题时不用去翻 Release
      - uses: actions/upload-artifact@v4
        with:
          name: ThShell-manifest
          path: release/latest.json
          retention-days: 30
